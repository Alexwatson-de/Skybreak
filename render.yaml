services:
  - type: web
    name: skybreak-multiplayer
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: GAME_TRANSPORT
        value: websocket
      - key: MAX_ROOMS
        value: "2"
      - key: PUBLIC_URL
        sync: false
      - key: WEB_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
